name: EdgeRuntimeBenchmark
options:
  bundleIdPrefix: com.beyondredaction
  deploymentTarget:
    iOS: "17.0"
settings:
  DEVELOPMENT_TEAM: 7CN4FZC3TB
  CODE_SIGN_STYLE: Automatic
targets:
  EdgeRuntimeBenchmark:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beyondredaction.EdgeRuntimeBenchmark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
